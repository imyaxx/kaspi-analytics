[project]
name = "kaspi-analytics"
version = "0.1.0"
description = "Kaspi.kz marketplace analytics & autopricing system"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Async HTTP stack
    "httpx[http2]>=0.27.0",
    "aiolimiter>=1.1.0",
    "tenacity>=8.5.0",

    # Data validation & fast parsing
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "orjson>=3.10.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",

    # Config & logging
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
    "rich>=13.7.0",

    # CLI entrypoint
    "typer>=0.12.0",

    # HTTP API for the dashboard
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
kaspi = "kaspi_parser.main:app"
kaspi-api = "kaspi_api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaspi_parser", "api/src/kaspi_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["kaspi_parser"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"